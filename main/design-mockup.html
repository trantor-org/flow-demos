<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Design mockup of the single-page StarPulse view, under operator review; not served by
  starpulse. data.js is a saved Board snapshot, and the page replays its last hour at 60x.
  View it with: uv run python -m http.server 8781 --directory lib/starpulse/design
-->
<title>StarPulse — single-page mockup</title>
<style>
:root { --bg0: #05070d; --ink: #dbe4f3; --muted: #6b7a93; --rail: 250px; --nav: 52px; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; }
canvas.drag { cursor: grabbing; }
aside { position: fixed; z-index: 2; top: 0; bottom: 0; box-sizing: border-box; padding: 20px 18px; overflow: hidden; background: rgba(8,12,22,.78);
  backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 18px; font-size: 11px; color: var(--muted); }
aside h3 { margin: 0 0 8px; font-size: 10px; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
#rail { right: 0; width: var(--rail); border-left: 1px solid rgba(148,163,184,.10); }
/* the navigator is a hair-thin hover zone; hovering fades a wispy panel in over the canvas, no hard edge, no layout shift */
#nav { left: 0; width: var(--nav); padding: 0; overflow: visible; z-index: 5; background: none; backdrop-filter: none; gap: 0; }
/* nothing sits behind the navigator: a faint hairline is the only cue, and the panel fades in place (no slide, no growth) */
#nav::after { content: ""; position: absolute; left: 0; top: 25%; bottom: 25%; width: 1px; background: linear-gradient(transparent, rgba(148,163,184,.22), transparent); transition: opacity .4s ease; pointer-events: none; }
#nav:hover::after, #nav:focus-within::after { opacity: 0; }
body:has(#nav:hover) #crumbs, body:has(#nav:focus-within) #crumbs { opacity: 0; }
#crumbs { transition: opacity .4s ease; }
#full { position: absolute; left: 0; top: 0; bottom: 0; width: 310px; box-sizing: border-box; padding: 20px 52px 20px 18px; display: flex; flex-direction: column; gap: 16px;
  isolation: isolate; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
#full::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(4,7,14,.9), rgba(4,7,14,.6) 60%, rgba(4,7,14,0));
  -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent); mask-image: linear-gradient(90deg, #000 45%, transparent); backdrop-filter: blur(7px); }
#nav:hover #full, #nav:focus-within #full { opacity: 1; pointer-events: auto; }
#full .t { font-weight: 300; letter-spacing: .02em; }
#mini .mg { display: block; border-radius: 50%; border: 1.5px solid #a78bfa; box-shadow: 0 0 8px rgba(167,139,250,.5); }
#mini .mg.here { background: rgba(167,139,250,.4); }
#mini .lv { width: 1px; height: 14px; background: rgba(148,163,184,.25); margin: -8px 0; }
#mini .pulse { width: 7px; height: 7px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
#mini .cnt { font: 10px "JetBrains Mono", ui-monospace, monospace; color: #fbbf24; }
#q { all: unset; box-sizing: border-box; width: 100%; padding: 6px 9px; border-radius: 6px; border: 1px solid rgba(148,163,184,.2); background: rgba(148,163,184,.06); font-size: 12px; color: var(--ink); }
#q:focus { border-color: #a78bfa; }
.node .chev { color: #475569; font-size: 10px; padding: 2px 4px; cursor: pointer; }
.node .chev:hover { color: var(--ink); }
.more { all: unset; cursor: pointer; display: block; padding: 3px 0 3px 30px; font-size: 11px; color: #64748b; }
.more:hover { color: var(--ink); }
#nav h1 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--ink); opacity: .85; }
#nav .sub { margin-top: 6px; font-size: 11px; line-height: 1.6; }
#nav .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 7px; vertical-align: 1px; box-shadow: 0 0 8px #34d399; }
#clock { color: #fbbf24; font: 10.5px "JetBrains Mono", ui-monospace, monospace; }
/* layer navigator: one node per level, a dashed spine joins a level to its children, the current path is lit */
.node { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px;
  width: 100%; padding: 5px 8px 5px 0; border-radius: 6px; color: #94a3b8; }
.node:hover { background: rgba(148,163,184,.08); color: var(--ink); }
.node.on { background: linear-gradient(90deg, rgba(167,139,250,.18), rgba(167,139,250,0)); color: var(--ink); }
.node.here { box-shadow: inset 2px 0 0 #a78bfa; }
.node .g { justify-self: center; border-radius: 50%; border: 1.5px solid currentColor; transition: box-shadow .2s, border-color .2s; }
.node .n { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.node.live .g { box-shadow: 0 0 0 3px rgba(251,191,36,.25), 0 0 10px #fbbf24; border-color: #fbbf24; }
.kids { margin-left: 10px; padding-left: 8px; border-left: 1px dashed rgba(148,163,184,.18); }
.lvl { font-size: 9px; letter-spacing: .22em; text-transform: uppercase; color: #3f4c66; margin: 6px 0 2px 30px; }
#rail .row { display: flex; flex-wrap: wrap; gap: 4px 14px; }
#rail button, #cons button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); letter-spacing: .04em; }
#rail button:hover, #cons button:hover { color: var(--ink); }
#cons button i { width: 5px; height: 5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399; }
#rail button.off { opacity: .35; text-decoration: line-through; }
#feed { font: 10.5px/1.75 "JetBrains Mono", ui-monospace, monospace; flex: 1; min-height: 0; overflow: hidden; }
#feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#feed b { font-weight: 400; color: var(--ink); } #feed em { font-style: normal; opacity: .6; }
#legend { line-height: 1.9; }
#legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 5px 0 0; vertical-align: 0; }
#legend span { margin-right: 10px; white-space: nowrap; }
.hud { position: fixed; z-index: 2; left: calc(var(--nav) + 24px); pointer-events: none; font-size: 12px; color: var(--muted); }
#crumbs { display: none; }
#crumbs button { all: unset; cursor: pointer; color: var(--muted); } #crumbs button:hover { color: var(--ink); }
#crumbs b { font-weight: 500; color: var(--ink); } #crumbs span { color: #3b4760; }
#tip { position: fixed; z-index: 4; pointer-events: none; padding: 8px 11px; border-radius: 8px; font-size: 12px; line-height: 1.5;
  background: rgba(12,19,34,.92); border: 1px solid rgba(148,163,184,.18); backdrop-filter: blur(6px); max-width: 380px; opacity: 0; transition: opacity .12s; }
#tip .k { color: var(--muted); font-size: 11px; } #tip .n { font-weight: 500; }
#panel { position: fixed; z-index: 3; top: 20px; right: calc(var(--rail) + 20px); width: 380px; max-height: calc(100% - 40px); overflow: auto; box-sizing: border-box;
  padding: 16px 18px; border-radius: 10px; font-size: 12px; line-height: 1.6; background: rgba(12,19,34,.95); border: 1px solid rgba(148,163,184,.2); display: none; }
#panel.open { display: block; }
#panel h2 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
#panel .k { color: var(--muted); font-size: 11px; }
#panel .x { position: absolute; top: 10px; right: 14px; cursor: pointer; color: var(--muted); }
#panel .desc { margin-top: 10px; white-space: pre-wrap; color: #b8c4d8; }
#panel table { border-collapse: collapse; margin-top: 8px; width: 100%; }
#tip .stats { display: flex; gap: 12px; margin: 6px 0 2px; } #tip .stats b { color: #fbbf24; font-weight: 600; }
#tip .fc { margin-top: 4px; color: #8b95a8; font-size: 11px; border-top: 1px dashed rgba(148,163,184,.25); padding-top: 4px; }
#panel table.trace td:first-child { color: #fbbf24; width: 22px; } #panel table.trace td:last-child { text-align: right; color: var(--muted); }
#panel td { padding: 2px 8px 2px 0; vertical-align: top; } #panel td:first-child { color: var(--muted); white-space: nowrap; }
#panel .run { margin-top: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid #34d399; background: rgba(52,211,153,.12); color: #34d399; cursor: pointer; font: inherit; }
#panel .run[disabled] { border-color: #475569; color: #64748b; background: none; cursor: not-allowed; }
#panel .note { margin-top: 6px; color: var(--muted); font-size: 11px; }
.chip { display: inline-block; padding: 0 6px; margin: 2px 4px 0 0; border-radius: 4px; background: rgba(148,163,184,.12); font-size: 11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside id="nav">
  <div id="full">
    <section><h1>StarPulse</h1><div class="sub"><span class="dot"></span><span id="stamp"></span></div></section>
    <section><input id="q" placeholder="filter layers…" autocomplete="off"></section>
    <section style="flex:1;min-height:0;overflow:auto"><h3>Layers</h3><div id="layers"></div></section>
    <section><h3>Constellations</h3><div id="cons"></div></section>
  </div>
</aside>
<div id="clock" class="hud" style="top:18px;left:auto;right:calc(var(--rail) + 24px)"></div>
<div id="crumbs" class="hud"></div>
<aside id="rail">
  <section><h3>Actors</h3><div class="row" id="kinds"></div></section>
  <section style="flex:1;min-height:0;display:flex;flex-direction:column"><h3>Recent</h3><div id="feed"></div></section>
  <section id="legend"><h3>Legend</h3></section>
</aside>
<div id="tip"></div>
<div id="panel"></div>

  const dpr = devicePixelRatio || 1; cx.globalAlpha = 1; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // the current board's night sky: a radial wash and 160 slow-twinkling stars with a slight parallax against the view
  const g = cx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.75); g.addColorStop(0, "#0e1628"); g.addColorStop(1, "#04060b"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  for (const s of STARS) { cx.fillStyle = `rgba(200,215,240,${0.08 + 0.12 * (0.5 + 0.5 * Math.sin(now * 0.0006 + s.p))})`; cx.beginPath(); cx.arc(s.x * W, (((s.y * H + view.y * 0.06 * s.r) % H) + H) % H, s.r, 0, TAU); cx.fill(); }
  if (!trans) drawScene(view.k, view.x, view.y);
  else { // in: the old level blows up through the clicked point and fades; the new one grows out of it. out: the reverse
    const q = Math.min(1, (now - trans.t0) / 520), e = ease(q), f = trans.f;
    const sNew = trans.inward ? 0.3 + 0.7 * e : 2.6 - 1.6 * e, sOld = trans.inward ? 1 + 2.5 * e : 1 - 0.7 * e;
    cx.globalAlpha = e; drawScene(view.k * sNew, f.x + sNew * (view.x - f.x), f.y + sNew * (view.y - f.y));
    cx.globalAlpha = 1 - e; cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.drawImage(trans.snap, f.x * (1 - sOld), f.y * (1 - sOld), W * sOld, H * sOld);
    cx.globalAlpha = 1; if (q >= 1) trans = null;
  }
  document.getElementById("clock").textContent = `▶ replaying ${hhmm(T)} MST · last hour at ${REPLAY.speed}×`;
  requestAnimationFrame(frame);
}

// ---- left: layer navigator + constellations; top: breadcrumbs; right: actors, feed, legend ----
const samePath = (a, b) => a.length === b.length && a.every((l, i) => l.kind === b[i].kind && levelName(l) === levelName(b[i]));
const onPath = (p) => p.length <= stack.length && p.every((l, i) => l.kind === stack[i].kind && levelName(l) === levelName(stack[i]));
const openStates = new Set(), showAll = new Set(); let query = "";
const CAP = 5; // machines listed per state before "+ N more"; the machine on the current path is always listed
function node(path, label, count, size, flow, toggle) {
  const b = document.createElement("button"); b.className = "node" + (onPath(path) ? " on" : "") + (samePath(path, stack) ? " here" : "");
  if (flow) b.dataset.flow = flow;
  b.innerHTML = `<i class="g" style="width:${size}px;height:${size}px"></i><span class="t">${esc(label)}</span><span class="n">${toggle ? `<span class="chev">${openStates.has(toggle) || onPath(path) ? "▾" : "▸"}</span>` : ""}${esc(count)}</span>`;
  b.onclick = (e) => { if (toggle && e.target.classList.contains("chev")) { openStates.has(toggle) ? openStates.delete(toggle) : openStates.add(toggle); return renderNav(); }
    samePath(path, stack) ? flyTo(fitScene()) : go(path); };
  return b;
}
const liveFirst = (a, b) => moving(b).length - moving(a).length || S.flows[b].agents.length - S.flows[a].agents.length;
function group(parent, label) { const d = document.createElement("div"); d.className = "kids"; if (label) d.insertAdjacentHTML("beforeend", `<div class="lvl">${label}</div>`); parent.append(d); return d; }
function renderNav() {
  const el = document.getElementById("layers"); el.innerHTML = "";
  const root = [{ kind: "board" }], q = query.trim().toLowerCase(), cnt = (id) => board.agents.filter((a) => a.state === id).length;
  const statePath = (id) => [...root, { kind: "state", id }];
  el.append(node(root, "Board", board.agents.length, 14));
  if (q) { // filtering: a flat list of every layer whose name matches, however deep
    const hits = group(el, "Matches"); let n = 0;
    for (const st of board.machine.states) if (st.name.toLowerCase().includes(q)) { hits.append(node(statePath(st.id), st.name, cnt(st.id), 10)); n++; }
    for (const [sid, subs] of Object.entries(SUBS)) for (const m of subs) if (m.includes(q)) { hits.append(node([...statePath(sid), { kind: "machine", flow: m }], m, S.flows[m].agents.length, 8, m)); n++; }
    for (const c of Object.values(CHILD)) for (const ch of Object.values(c)) if (ch.flow.includes(q)) { hits.append(node([...statePath("in_progress"), { kind: "machine", flow: "in-progress" }, { kind: "machine", flow: ch.flow }], ch.flow, S.flows[ch.flow].agents.length, 6, ch.flow)); n++; }
    if (!n) hits.insertAdjacentHTML("beforeend", '<div class="lvl">no layer matches</div>');
  } else {
    const kids = group(el);
    for (const st of board.machine.states) {
      const sp = statePath(st.id), subs = (SUBS[st.id] || []).slice().sort(liveFirst), open = subs.length && (openStates.has(st.id) || onPath(sp));
      kids.append(node(sp, st.name, cnt(st.id), subs.length ? 11 : 9, null, subs.length ? st.id : null));
      if (!open) continue;
      const mk = group(kids), pathM = stack[2]?.flow, shown = showAll.has(st.id) ? subs : subs.filter((m, i) => i < CAP || m === pathM);
      for (const m of shown) {
        const mp = [...sp, { kind: "machine", flow: m }]; mk.append(node(mp, m, S.flows[m].agents.length, 8, m));
        const ck = onPath(mp) ? Object.values(CHILD[m] || {}) : []; if (!ck.length) continue;
        const cd = group(mk); for (const c of ck) cd.append(node([...mp, { kind: "machine", flow: c.flow }], c.flow, S.flows[c.flow].agents.length, 6, c.flow));
      }
      if (shown.length < subs.length) { const b = document.createElement("button"); b.className = "more"; b.textContent = `+ ${subs.length - shown.length} more lifecycle machines`; b.onclick = () => { showAll.add(st.id); renderNav(); }; mk.append(b); }
    }
  }
  const crumbs = document.getElementById("crumbs"); crumbs.innerHTML = "";
  stack.forEach((l, i) => { if (i) crumbs.insertAdjacentHTML("beforeend", "<span>›</span>");
    if (i === stack.length - 1) { crumbs.insertAdjacentHTML("beforeend", `<b>${esc(levelName(l))}</b>`); return; }
    const b = document.createElement("button"); b.textContent = levelName(l); b.onclick = () => go(stack.slice(0, i + 1)); crumbs.append(b); });
}
// a lifecycle node in the navigator glows while its machine is moving
setInterval(() => document.querySelectorAll(".node[data-flow]").forEach((b) => b.classList.toggle("live", moving(b.dataset.flow).length > 0)), 200);
document.getElementById("q").addEventListener("input", (e) => { query = e.target.value; renderNav(); });
function renderRail() {
  const cons = document.getElementById("cons"); cons.innerHTML = "";
  for (const grp of GROUPS) { const b = document.createElement("button"); b.innerHTML = `<i></i><span>${esc(grp.name)} · ${grp.dags.length}</span>`;
    b.onclick = () => { const box = () => { const s = scene.groups.find((g) => g.name === grp.name).stars, xs = s.map((q) => q.x), ys = s.map((q) => q.y); return fitBox(Math.min(...xs) - 60, Math.min(...ys) - 80, Math.max(...xs) + 60, Math.max(...ys) + 80, 0.9); };
      if (stack.at(-1).kind !== "dags") go([{ kind: "board" }, { kind: "dags" }], W / 2, H / 2, box); else flyTo(box()); }; cons.append(b); }
  const kinds = document.getElementById("kinds"); kinds.innerHTML = "";
  const all = Object.values(S.flows).filter((f) => f.name !== "board").flatMap((f) => f.agents), per = {};
  all.forEach((s) => (per[s.kind] = (per[s.kind] || 0) + 1));
  for (const k of ["interactive", "unattended", "ci", "eval"]) { const b = document.createElement("button"); b.innerHTML = `<span>${k} ${per[k] || 0}</span>`; if (hiddenKinds.has(k)) b.className = "off";
    b.onclick = () => { hiddenKinds.has(k) ? hiddenKinds.delete(k) : hiddenKinds.add(k); localStorage.setItem("fv.hidden", JSON.stringify([...hiddenKinds])); renderRail(); }; kinds.append(b); }
  document.getElementById("legend").innerHTML = `<h3>Legend</h3>
    <span><i style="background:#c4b5fd"></i>opus</span><span><i style="background:#67e8f9"></i>sonnet</span><span><i style="background:#fde68a"></i>other</span><br>
    <span><i style="background:#6b7a93"></i>interactive</span><span><i style="border:1.5px solid #6b7a93;box-sizing:border-box"></i>unattended</span><span><i style="background:#6b7a93;border-radius:0"></i>ci</span><br>
    <span><i style="background:#34d399"></i>ok</span><span><i style="background:#fb7185"></i>failed</span><span><i style="border:1px solid #dbe4f3;background:none;box-sizing:border-box"></i>runnable</span><br>
    <span><i style="background:#c084fc;box-shadow:0 0 0 2px #0a0e1a,0 0 0 3px #c084fc"></i>lifecycle machine</span><span><i style="background:${ACT};box-shadow:0 0 6px ${ACT}"></i>activity now</span>`;
}
// the feed shows what the replay has reached, newest first
let fedTo = -2;
setInterval(() => { const i = EVENTS.findLastIndex((e) => e.at <= T), dn = S.dags.filter((d) => d.finishedAt && Date.parse(d.finishedAt) / 1000 <= T).length;
  if (i * 100 + dn === fedTo) return; fedTo = i * 100 + dn;
  const ev = EVENTS.slice(0, i + 1).map((e) => ({ at: e.at, html: `<b>${esc(e.task || e.sid.slice(0, 8))}</b> ${esc(e.event.toLowerCase())} <em>${esc(e.flow)}</em>` }));
  S.dags.forEach((d) => { const f = d.finishedAt && Date.parse(d.finishedAt) / 1000; if (f && f <= T) ev.push({ at: f, html: `<b>${esc(d.name)}</b> <em>${esc(d.status)}</em>` }); });
  ev.sort((a, b) => b.at - a.at); document.getElementById("feed").innerHTML = ev.slice(0, 40).map((e) => `<div><em>${hhmm(e.at)}</em> ${e.html}</div>`).join(""); }, 250);

document.getElementById("stamp").textContent = `snapshot ${new Date(S.now * 1000).toLocaleString("en-US", { timeZone: TZ, dateStyle: "medium", timeStyle: "short" })} MST`;
renderRail(); resize(); renderNav();
addEventListener("resize", resize);
addEventListener("keydown", (e) => { if (e.key === "Escape") { panel.classList.remove("open"); pinned = null; } if (e.target.id === "q") return; if (e.key === "Backspace") pop(); if (e.key === "0") flyTo(fitScene()); });
requestAnimationFrame(frame);
</script>
</body>
